version: "3.9"

name: ai_assistant_manager

services:
  api:
    container_name: ai_assistant_manager_api
    image: python:3.11-slim
    working_dir: /workspace/apps/api
    volumes:
      - ./apps/api:/workspace/apps/api
    environment:
      SERVICE_NAME: ai-assistant-manager
      ENV: dev
      LOG_LEVEL: INFO
      CORS_ALLOW_ORIGINS: http://localhost:2000
    ports:
      - "7000:7000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7000/health').read(); print('ok')\""]
      interval: 5s
      timeout: 3s
      retries: 30
    command:
      - sh
      - -lc
      - |
          set -e
          python -m pip install -U pip wheel
          python -m pip install \
            'fastapi>=0.110' \
            'uvicorn>=0.23' \
            'watchfiles>=0.21' \
            'pydantic>=2.5' \
            'python-dotenv>=1.0'
          PYTHONPATH=./src uvicorn app.main:app --host 0.0.0.0 --port 7000 --reload

  web:
    container_name: ai_assistant_manager_web
    image: node:20-slim
    working_dir: /workspace/apps/web
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:7000
    ports:
      - "2000:2000"
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
          set -e
          npm install
          npm run dev -- -p 2000 --hostname 0.0.0.0

volumes:
  web_node_modules:
